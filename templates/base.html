<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GestureLock{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <aside class="profile-panel">
      <h2>Profile</h2>
      {% if session.get('user_id') %}
        <p class="profile-status logged-in">● Logged in</p>
        <p class="profile-email">{{ logged_in_email }}</p>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Log out</a>
      {% else %}
        <p class="profile-status logged-out">● Not logged in</p>
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('signup') }}">Create account</a>
      {% endif %}
    </aside>
    <main class="card">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
