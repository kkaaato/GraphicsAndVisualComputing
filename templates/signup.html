{% extends "base.html" %}
{% block title %}Sign up — GestureLock{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Sign up</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <p class="muted-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  <p class="muted-link"><a href="{{ url_for('home') }}">Back</a></p>
{% endblock %}
