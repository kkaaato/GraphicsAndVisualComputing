{% extends "base.html" %}
{% block title %}New Quiz — GestureLock{% endblock %}
{% block content %}
  <h1>Create a quiz</h1>
  <form method="post">
    <label>Title</label>
    <input type="text" name="title" required>
    <label>Questions (one per line): question|choiceA|choiceB|choiceC|choiceD|correctLetter</label>
    <textarea name="questions" placeholder="What does CPU stand for?|Central Processing Unit|Computer Personal Unit|Central Program Utility|Core Processing Utility|A"></textarea>
    <button type="submit">Save quiz</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <p class="muted-link"><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
{% endblock %}
