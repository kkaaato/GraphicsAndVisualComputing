{% extends "base.html" %}
{% block title %}{{ 'Edit Quiz' if quiz else 'New Quiz' }} — GestureLock{% endblock %}
{% block content %}
  <h1>{{ 'Edit quiz' if quiz else 'Create a quiz' }}</h1>
  <form method="post">
    <label>Title</label>
    <input type="text" name="title" value="{{ quiz.title if quiz else '' }}" required>
    <label class="setting-toggle">
      <input type="checkbox" name="show_correct_answer" value="1"{% if quiz and quiz.show_correct_answer %} checked{% endif %}>
      Show the correct answer to participants after they answer
    </label>
    <label class="setting-toggle">
      <input type="checkbox" name="show_scoreboard" value="1"{% if quiz and quiz.show_scoreboard %} checked{% endif %}>
      Let participants see the final leaderboard
    </label>
    <div id="question-list"></div>
    <button id="add-question" type="button">+ Add question</button>
    <textarea id="questions" name="questions" hidden></textarea>
    <button type="submit">Save quiz</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="btn-row"><a class="btn btn-secondary btn-small" href="{{ url_for('dashboard') }}">Back to dashboard</a></div>
{% endblock %}
{% block scripts %}
  <div id="edit-quiz-data" data-quiz='{{ (quiz.questions if quiz else None) | tojson }}' hidden></div>
  <script src="{{ url_for('static', filename='new_quiz.js') }}"></script>
{% endblock %}
